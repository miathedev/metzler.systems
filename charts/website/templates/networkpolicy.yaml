# networkpolicy.yaml: default-deny fuer die App-Pods — Ingress nur vom
# Traefik-Namespace (Ingress-Controller) plus zwei Ausnahmen im eigenen
# Namespace (k6-Run-Jobs des load-Charts, helm-test-Pods), Egress nur DNS
# (kube-system). Kubelet-Probes kommen vom Node und bleiben vom CNI unberuehrt
# (Calico DefaultEndpointToHostAction=ACCEPT). Statische Site braucht sonst
# keinen Egress.
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "website.fullname" . }}-default-deny
  labels:
    {{- include "website.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "website.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    # k6-Run-Jobs des load-Charts feuern aus dem SELBEN Namespace auf diesen
    # Service — ohne diese Regel wuerde ein durchsetzender CNI (prod: Calico)
    # die Requests am Ziel-Pod droppen und der Lasttest liefe ins Leere.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: load-run
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    # helm-test-Pods (tests/test-connection.yaml) duerfen den Service wgetten.
    - from:
        - podSelector:
            matchLabels:
              metzler.systems/helm-test: "true"
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  egress:
    # DNS-Aufloesung (kube-dns/coredns in kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
