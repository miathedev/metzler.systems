# Default values for cluster-issuers.
# Ein ClusterIssuer pro Eintrag; das website-Chart referenziert einen davon
# ueber die Annotation cert-manager.io/cluster-issuer.
email: ""

clusterIssuers:
  # Staging zuerst testen (keine Rate-Limits), dann prod aktivieren.
  - name: letsencrypt-staging
    enabled: true
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    ingressClass: traefik

  - name: letsencrypt-prod
    enabled: true
    server: https://acme-v02.api.letsencrypt.org/directory
    ingressClass: traefik
