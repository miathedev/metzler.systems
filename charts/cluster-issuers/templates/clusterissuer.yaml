{{- range .Values.clusterIssuers }}
{{- if .enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .name }}
spec:
  acme:
    server: {{ .server }}
    email: {{ $.Values.email | quote }}
    privateKeySecretRef:
      name: {{ .name }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .ingressClass }}
---
{{- end }}
{{- end }}
