# service.yaml: ClusterIP-Service der metric-App auf Port 8080 (Ingress siehe ingress.yaml).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "metric.fullname" . }}
  labels:
    {{- include "metric.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "metric.selectorLabels" . | nindent 4 }}
