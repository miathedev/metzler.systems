{{- if .Values.configMapImmutable.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ include "kyverno-policies.fullname" . }}-configmap-immutable
  labels:
    {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-immutable
      match:
        any:
          - resources:
              kinds:
                - ConfigMap
      exclude:
        any:
          # System-Namespaces und die automatisch verwaltete CA-ConfigMap ausnehmen,
          # damit der Cluster-Betrieb nicht blockiert wird.
          - resources:
              kinds:
                - ConfigMap
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
          - resources:
              kinds:
                - ConfigMap
              names:
                - kube-root-ca.crt
      validate:
        message: "ConfigMaps müssen mit immutable: true erstellt werden."
        pattern:
          immutable: true
{{- end }}
