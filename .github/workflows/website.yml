# website.yml: baut das Hugo-Site-Image, pusht es nach ghcr.io und bumped den
# Chart-Tag in charts/website/values.yaml auf den Commit-SHA — der Bump passiert
# erst im Job bump-tag, NACHDEM der Trivy-Image-Scan (scan) gruen ist.
name: website-image

# Auslöser: Änderungen an site/, den dev-Skripten/Hooks (shell-Job) oder diesem
# Workflow. Actions sind auf Commit-SHA gepinnt (immutable); Renovate
# aktualisiert die SHAs automatisch (pinDigests in renovate.json).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'dev/**'
      - 'pre-commit.sh'
      - '.githooks/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: write   # bump-tag: Tag-Bump-Commit in charts/website/values.yaml
  packages: write   # Push nach ghcr.io

concurrency:
  group: website-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell-Skripte (bash -n + shellcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: shellcheck bereitstellen (fehlt im Runner-Image -> apt)
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi

      - name: bash -n + shellcheck ueber alle Shell-Skripte des Repos
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          echo "${#scripts[@]} Skripte"
          for f in "${scripts[@]}"; do bash -n "$f"; done
          shellcheck "${scripts[@]}"

  build-and-push:
    # Erst bauen/pushen, wenn der shell-Check grün ist; der Tag-Bump passiert
    # absichtlich NICHT hier, sondern erst in bump-tag nach dem Image-Scan.
    needs: shell
    runs-on: ubuntu-latest
    permissions:
      # pusht nie selbst in den Branch — nur bump-tag braucht contents: write
      contents: read
      packages: write   # Push nach ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Login ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Tags erzeugen (sha + latest auf main)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ghcr.io/${{ github.repository }}/website
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Image bauen und pushen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: site
          file: site/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build-Versionen (HUGO_VERSION) leben nur in site/Dockerfile —
          # Renovate aktualisiert sie dort per PR (siehe renovate.json).

      - name: ghcr-Package public machen (Repo ist public)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE=$(echo '${{ github.repository }}/website' | sed 's|/|%2F|')
          gh api -X PATCH "/user/packages/container/${PACKAGE}/visibility" -f visibility=public \
            || gh api -X PATCH "/orgs/${{ github.repository_owner }}/packages/container/${PACKAGE}/visibility" -f visibility=public \
            || echo "Konnte Sichtbarkeit nicht per API setzen — einmal manuell in GitHub unter Packages auf public stellen"

  scan:
    name: Trivy-Scan (CRITICAL blockiert den Tag-Bump)
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Image-Ref aufloesen
        id: img
        run: echo "ref=ghcr.io/${{ github.repository }}/website:sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Trivy-Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          format: table
          severity: CRITICAL
          exit-code: '1'  # CRITICAL blockiert: bump-tag (und damit Flux) sieht nur gescannte Images
          ignore-unfixed: true

  bump-tag:
    name: Chart-Tag auf Commit-SHA aktualisieren
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: image.tag im Chart automatisiert auf Commit-SHA aktualisieren
        run: |
          # metadata-action pusht type=sha,format=short -> Tag "sha-<7 Zeichen>".
          # Der Chart-Tag muss exakt dazu passen, sonst schlaegt der Image-Pull fehl.
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          yq -i ".image.repository = \"ghcr.io/${{ github.repository }}/website\" | .image.tag = \"sha-${SHORT_SHA}\"" charts/website/values.yaml
          # Chart-Version mitbumpen: helm-controller cacht Charts am Version-String
          # und wuerde sonst trotz neuem values.yaml-Tag das alte Chart deployen.
          yq -i ".version = \"0.3.${{ github.run_number }}\"" charts/website/Chart.yaml
          git config user.name "github-actions[bot]"
          # https://github.com/orgs/community/discussions/26560
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/website/values.yaml charts/website/Chart.yaml
          git commit -m "Chore(website): image auf ${{ github.sha }} [skip ci]" || echo "tag bereits aktuell, nichts zu committen"
          git push
