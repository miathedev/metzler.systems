helmDefaults:
  wait: true
  timeout: 600

repositories:
  - name: kyverno
    url: https://kyverno.github.io/kyverno/

releases:
  #Kyverno Admission
  - name: kyverno
    namespace: kyverno
    createNamespace: true
    installed: false
    chart: kyverno/kyverno

  #metzler.systems cluster policys
  - name: kyverno-policies
    namespace: kyverno
    createNamespace: true
    chart: ./charts/kyverno-policies

  #Die Webseite
  - name: website
    namespace: website
    createNamespace: true
    chart: ./charts/website
