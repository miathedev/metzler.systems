# kind-Cluster fuer den lokalen Test-Stack (siehe dev/README.md).
# Host-Port 80/443 werden vom Docker-Daemon (root) gebunden und auf die
# NodePorts 30080/30443 des Traefik im Node durchgereicht — kein sudo noetig.
# Ist 80/443 auf dem Host belegt, generiert setup.sh diese Datei mit
# hostPort 8080/8443 nach /tmp um (Fallback).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
