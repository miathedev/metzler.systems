# ---------------------------------------------------------------------------
# Admission Controller
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m0s
  chart:
    spec:
      chart: kyverno
      version: "3.10.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      interval: 1m0s
  values:
    admissionController:
      # 3 Replicas, damit ein einzelner Pod-Ausfall (z.B. Node-Drain) nicht
      # gleich den Admission-Webhook unerreichbar macht (failurePolicy: Fail).
      replicas: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
# ---------------------------------------------------------------------------
# cert-manager
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m0s
  dependsOn:
    - name: kyverno
      namespace: kyverno
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.3"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1m0s
  values:
    crds:
      enabled: true
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
# ---------------------------------------------------------------------------
# ClusterIssuer (Let's Encrypt staging+prod)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cluster-issuers
  namespace: cert-manager
spec:
  interval: 30m0s
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: charts/cluster-issuers
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m0s
  valuesFrom:
    # Ohne valuesKey: Flux merged das gesamte Secret als Values ->
    # key "email" landet direkt bei .Values.email im Chart.
    - kind: Secret
      name: letsencrypt-email
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
# ---------------------------------------------------------------------------
# Traefik Ingress-Controller als DaemonSet: ein Pod pro Node. Der LoadBalancer
# (Service traefik) hat damit auf jedem Node einen lokalen Endpunkt, und
# Scale-down/Redeploy einzelner Autoscaler-Nodes (vpa-Nodepool) erzeugen keine
# Ingress-Ausfaelle mehr, solange mindestens ein Node Ready ist.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m0s
  chart:
    spec:
      chart: traefik
      version: "42.4.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1m0s
  values:
    deployment:
      kind: DaemonSet
    service:
      spec:
        # Erst mit DaemonSet auf jedem Node sicher: Client-IP bleibt erhalten
        # (sonst SNAT beim Cross-Node-Forwarding) und Nodes ohne lokalen
        # Traefik-Pod fallen ueber den LB-Health-Check aus dem Pool.
        externalTrafficPolicy: Local
    ingressClass:
      enabled: true
      name: traefik
    providers:
      kubernetesIngress:
        enabled: true
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
# ---------------------------------------------------------------------------
# Kyverno ClusterPolicies
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  interval: 30m0s
  dependsOn:
    - name: kyverno
      namespace: kyverno
  chart:
    spec:
      chart: charts/kyverno-policies
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
# ---------------------------------------------------------------------------
# metrics-server (metrics.k8s.io API für kubectl top und die metric-App)
# Infomaniak-KaaS-Sonderlocken (Details inline, damit keine lokalen Doku-Namen ins Repo wandern):
# Kubelet-Serving-Certs haben keine IP-SANs und Node-Hostnames sind aus dem
# Pod-Netz nicht auflösbar, deshalb --kubelet-insecure-tls und InternalIP.
# Das Chart hängt `args` an die defaultArgs an, spätere Flags gewinnen.
# Risiko: --kubelet-insecure-tls schaltet die TLS-Verifikation der
# Kubelet-Verbindung aus (MITM im Clusternetz wäre möglich). Mangels IP-SANs
# vorerst nötig; langfristig Kubelet-Certs mit IP-SANs oder TLS-Proxy, dann Flag entfernen.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 30m0s
  chart:
    spec:
      chart: metrics-server
      version: "3.14.0"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
      interval: 1m0s
  values:
    args:
      - --kubelet-insecure-tls
      - --kubelet-preferred-address-types=InternalIP
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
# ---------------------------------------------------------------------------
# Metrics-API (Namespace website, metzler.systems/api/metrics hängt am
# bestehenden Traefik-LoadBalancer, kein eigener LoadBalancer)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metric
  namespace: website
spec:
  interval: 30m0s
  dependsOn:
    - name: traefik
      namespace: traefik
    - name: cluster-issuers
      namespace: cert-manager
    - name: metrics-server
      namespace: kube-system
  chart:
    spec:
      chart: charts/metric
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m0s
  # Anti-Exfiltration: Egress zur K8s-API auf den API-Endpunkt des Clusters
  # pinnen. CIDRs + Ports kommen nicht aus dem Repo, sondern per valuesFrom
  # aus dem Secret `k8s-api-endpoint` im selben Namespace wie die HelmRelease
  # (wird einmalig out-of-band angelegt). Calico wertet Egress nach DNAT aus,
  # deshalb muss der targetPort des `kubernetes`-Service mit hinein.
  valuesFrom:
    - kind: Secret
      name: k8s-api-endpoint
      valuesKey: netpol.yaml
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
# ---------------------------------------------------------------------------
# Webseite
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: website
  namespace: website
spec:
  interval: 30m0s
  dependsOn:
    - name: traefik
      namespace: traefik
    - name: cluster-issuers
      namespace: cert-manager
  chart:
    spec:
      chart: charts/website
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
# ---------------------------------------------------------------------------
# Load-Service (Namespace website, metzler.systems/api/load hängt am
# bestehenden Traefik-LoadBalancer): kuenstlicher Last-Trigger fuer die
# website (POST /api/load/ = 5-min-Run, 409 solange aktiv). RBAC nur
# batch/jobs + pods/log im eigenen Namespace (charts/load/templates/rbac.yaml),
# skaliert wird ueber den HPA der website.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: load
  namespace: website
spec:
  interval: 30m0s
  dependsOn:
    - name: traefik
      namespace: traefik
    - name: cluster-issuers
      namespace: cert-manager
    - name: website
      namespace: website
  chart:
    spec:
      chart: charts/load
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m0s
  # Anti-Exfiltration: Egress zur K8s-API auf den API-Endpunkt des Clusters
  # pinnen. CIDRs + Ports kommen nicht aus dem Repo, sondern per valuesFrom
  # aus dem Secret `k8s-api-endpoint` im selben Namespace wie die HelmRelease
  # (wird einmalig out-of-band angelegt). Calico wertet Egress nach DNAT aus,
  # deshalb muss der targetPort des `kubernetes`-Service mit hinein.
  valuesFrom:
    - kind: Secret
      name: k8s-api-endpoint
      valuesKey: netpol.yaml
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
