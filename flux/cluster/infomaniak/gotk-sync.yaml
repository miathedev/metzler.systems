# gotk-sync.yaml: GitRepository + Kustomization, von flux install generiert und manuell um HelmReleases erweitert (DO-NOT-EDIT-Marker des generierten Teils siehe gotk-components.yaml).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  url: https://github.com/miathedev/metzler.systems.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./flux/cluster/infomaniak
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    # Kyverno
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno
      namespace: kyverno
      
    # Gateway API
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cluster-issuers
      namespace: cert-manager
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik
      namespace: traefik

    # Kyverno regeln
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno-policies
      namespace: kyverno

    # metrics-server (metrics.k8s.io API), wird nicht von infomaniak by default mitgeliefert
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: metrics-server
      namespace: kube-system

    # Metrics-API, um auf der webseite live den state darzustellen
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: metric
      namespace: website

    # Webseite
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: website
      namespace: website

    # Load-Service (k6-Run-Jobs als Last-Trigger fuer die website)
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: load
      namespace: website
