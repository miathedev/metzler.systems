# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name (set in params.yaml under hugoblox.branding.name)
title: 'metzler.systems'
# Website URL
baseURL: 'https://metzler.systems/'

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: false
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
disableAliases: true
outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    rel: alternate
  # .md-Mirror fuer jede Seite (LLM-/Agent-Konsum): /about/ -> /about/index.md
  # Invariante: jede Seite (page, section, taxonomy, term, home) existiert
  # doppelt — als HTML und als /index.md. Templates: layouts/index.md.md und
  # layouts/_default/*.md.md, rendern .RawContent — Shortcodes (z.B. {{< email >}})
  # bleiben roh, dafuer bleiben Markdown-Struktur und Tabellen erhalten;
  # Front-Matter fehlt im .md. Head-Hook layouts/_partials/hooks/head-start/
  # md-alternate.html verlinkt den Mirror als <link rel="alternate">.
  md:
    mediaType: text/markdown
    baseName: index
    isPlainText: true
    rel: alternate
outputs:
  home: [HTML, RSS, llms, md, headers, redirects, backlinks]
  page: [HTML, md]
  section: [HTML, RSS, md]
  taxonomy: [HTML, RSS, md]
  term: [HTML, RSS, md]
imaging:
  resampleFilter: lanczos
  anchor: smart
  jpeg:
    quality: 90
  webp:
    quality: 90
    hint: picture
  avif:
    quality: 90
timeout: 600000
taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
  exec:
    # Hugo >= 0.163: nur whitelisted Binaries dürfen ausgeführt werden
    # (go + git für Hugo-Module, tailwindcss CLI fürs CSS)
    allow:
      - '^go$'
      - '^git$'
      - '^node$'
      - '^tailwindcss$'
sitemap:
  _merge: deep
