{{- /* Bandcamp-Einbettungsplayer fuer Album/Track. Aufruf: {{< bandcamp album="2004128651" >}} oder {{< bandcamp track="123456" >}} */ -}}
{{- $id := .Get "album" | default (.Get "track") -}}
{{- $kind := cond (.Get "album") "album" "track" -}}
<iframe style="border: 0; width: 100%; height: 120px;" src="https://bandcamp.com/EmbeddedPlayer/{{ $kind }}={{ $id }}/size=large/bgcol=ffffff/linkcol=0687f5/tracklist=false/artwork=small/transparent=true/" seamless title="Bandcamp player" loading="lazy"></iframe>
