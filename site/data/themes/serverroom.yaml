# serverroom.yaml: eigenes Theme-Paket fuer metzler.systems (Serverraum bei Nacht).
# Tintengetönte neutrale Flächen (unslop-Tokens, Ink-Rampe) mit einem einzelnen
# LED-Amber-Akzent aus der echten Welt (Status-LEDs, Terminal-Glühen).
# Ersetzt das Paket "synthwave" (tiefvioletter Hintergrund, Neon-Pink/Cyan).

hugoblox:
  meta:
    format: "hugoblox-theme@1"
    name: "Serverroom"
    vendor: "metzler.systems"
    version: "1.0.0"
    license: "MIT"
    description: "Ink-dark surfaces with one amber accent, for a self-hosted infra portfolio"

  type: "dual"

  dark:
    colors:
      primary: "amber"    # LED-Amber, der eine Akzent: Status-Punkt, Selektion, Kennzahlen
      secondary: "teal"   # nur wo ein zweiter Farbton wirklich nötig ist
    surfaces:
      background: "#0b0d14"   # Tinten-Seitenhintergrund
      foreground: "#eef0f5"   # Tinten-Haupttext
      header:
        background: "#0b0d14"
        foreground: "#eef0f5"
      footer:
        background: "#07080d"   # dunkelste Fläche
        foreground: "#7a8296"   # Tinten-dezenter Text

  light:
    colors:
      primary: "amber"
      secondary: "teal"
    surfaces:
      background: "#fafafa"
      foreground: "#171717"
      header:
        background: "#f4f4f5"
        foreground: "#171717"
      footer:
        background: "#f4f4f5"
        foreground: "#525252"
